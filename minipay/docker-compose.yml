services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minipay
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/minipay?sslmode=disable
      # Offline mode by default. For real Stripe test mode, unset this and set
      # STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET (e.g. via a .env file).
      MINIPAY_FAKE_STRIPE: ${MINIPAY_FAKE_STRIPE:-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

volumes:
  pgdata:
